name: Desktop

# Builds installers for macOS, Windows and Linux on every push to main and PR.
# Pushing a tag like v0.1.0 also creates a draft GitHub Release with the installers.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google OAuth "Desktop app" client, compiled in with option_env! (M5)
          CATENGA_GOOGLE_CLIENT_ID: ${{ secrets.CATENGA_GOOGLE_CLIENT_ID }}
          CATENGA_GOOGLE_CLIENT_SECRET: ${{ secrets.CATENGA_GOOGLE_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          # Only publish a release for version tags; otherwise just build and upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Catenga Focus ${{ github.ref_name }}
          releaseDraft: true
          uploadWorkflowArtifacts: true
