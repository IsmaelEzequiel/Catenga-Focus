name: Server

# Builds the server Docker image on every push and PR.
# Pushes to GitHub Container Registry (ghcr.io) on main and version tags.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["server/**", "pnpm-lock.yaml", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "pnpm-lock.yaml", ".github/workflows/server.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-server
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only on main pushes, and only once the owner has added FLY_API_TOKEN.
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master
      - if: env.FLY_API_TOKEN != ''
        # metadata-action pushes the image under a lowercase name; ghcr refs must match it.
        run: flyctl deploy --config server/fly.toml --image "ghcr.io/${GITHUB_REPOSITORY,,}-server:sha-${GITHUB_SHA::7}"
